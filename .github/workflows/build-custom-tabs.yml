name: Build Custom Tabs (macOS DMG)

# Builds the macOS app (with the custom non-native tab bar) into an unsigned
# DMG artifact. Runs on GitHub-hosted macOS runners so it sidesteps local
# disk/network limits. The `ReleaseLocal` Xcode config is ad-hoc signed, so no
# Apple Developer certificate is required.

on:
  workflow_dispatch: {}
  push:
    branches: [custom-macos-tabs]

permissions:
  contents: read

jobs:
  build:
    # macOS 15 image ships Xcode 26 (required by Ghostty main). If this ever
    # regresses, bump to `macos-26` once GitHub promotes that label.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-number generation reads full history

      - name: Show available Xcodes
        run: |
          ls /Applications | grep -i Xcode || true
          xcodebuild -version || true

      - name: Select Xcode 26
        run: |
          # Ghostty main needs Xcode 26. Pick the newest 26.x — but SKIP 26.3.x:
          # its actool has a regression that fails to compile Ghostty's Icon
          # Composer `.icon` (verified locally: 26.6 and <=26.2 compile it fine,
          # 26.3.0 exits 65). Fall back gracefully if only 26.3 exists.
          CANDIDATES=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V)
          XC=$(echo "$CANDIDATES" | grep -v "Xcode_26\.3" | tail -1)
          [ -z "$XC" ] && XC=$(echo "$CANDIDATES" | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          # Export for every later step (incl. `nix develop`, whose shell would
          # otherwise resolve xcrun to the nix Apple SDK instead of real Xcode).
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Ensure Metal Toolchain
        run: |
          # Xcode 26 ships the Metal compiler as an on-demand component. The
          # runner images usually have it preinstalled; only download if the
          # compiler can't actually run (avoids a needless catalog fetch that
          # can fail on a version mismatch).
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal Toolchain already present."
          else
            echo "Metal Toolchain missing — downloading."
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Ghostty.app (ReleaseLocal)
        run: |
          # ReleaseFast maps to the ad-hoc-signed "ReleaseLocal" Xcode config.
          nix develop --command zig build -Doptimize=ReleaseFast
          echo "--- artifacts ---"
          ls -la macos/build/ReleaseLocal/ || (echo "app not found; listing macos/build"; find macos/build -maxdepth 2 -name "*.app" -o -maxdepth 2 -type d | head)

      - name: Package DMG
        run: |
          APP=$(find macos/build -maxdepth 2 -name "Ghostty.app" -type d | head -1)
          echo "Packaging $APP"
          test -n "$APP"
          STAGE="$(mktemp -d)/Ghostty"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Ghostty (Custom Tabs)" \
            -srcfolder "$STAGE" -ov -format UDZO Ghostty-CustomTabs.dmg
          ls -la Ghostty-CustomTabs.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-CustomTabs-dmg
          path: Ghostty-CustomTabs.dmg
          if-no-files-found: error
